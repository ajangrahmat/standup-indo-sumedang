<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Stand Up Indo Sumedang Photobooth</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#111;
font-family:Arial;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.preview{
position:relative;
width:min(95vw,420px);
aspect-ratio:9/16;
overflow:hidden;
border-radius:10px;
background:#000;
}

video{
position:absolute;
left:4%;
top:5.5%;
width:92%;
height:75%;
object-fit:cover;
transform:scaleX(-1);
}

.frame{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
pointer-events:none;
}

.menu{
margin-top:15px;
display:flex;
gap:10px;
}

button,a{
padding:12px 22px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
text-decoration:none;
background:#8b0000;
color:white;
}

canvas{
display:none;
}

</style>

</head>
<body>

<div class="preview">

<video id="video" autoplay playsinline></video>

<img src="frame.png" class="frame">

</div>

<div class="menu">
<button id="capture">📸 Ambil Foto</button>
<a id="download" download="stand-up-indo-sumedang-bg-open-mic.png">Download</a>
</div>

<canvas id="canvas" width="1080" height="1920"></canvas>

<script>

const video=document.getElementById("video");

navigator.mediaDevices.getUserMedia({

video:{
facingMode:"user"
}

})
.then(stream=>{
video.srcObject=stream;
});

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const frame=new Image();
frame.src="frame.png";

/*
Koordinat area foto pada hasil 1080x1920

Silakan sesuaikan jika ingin lebih presisi.
*/

const FRAME_X=48;
const FRAME_Y=78;
const FRAME_W=985;
const FRAME_H=1500;

document.getElementById("capture").onclick=function(){

ctx.clearRect(0,0,1080,1920);

ctx.save();

ctx.translate(FRAME_X+FRAME_W,FRAME_Y);
ctx.scale(-1,1);

ctx.drawImage(
video,
0,
0,
video.videoWidth,
video.videoHeight,
0,
0,
FRAME_W,
FRAME_H
);

ctx.restore();

ctx.drawImage(frame,0,0,1080,1920);

document.getElementById("download").href=
canvas.toDataURL("image/png");

};

</script>

</body>
</html>
