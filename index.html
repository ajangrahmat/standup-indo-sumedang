<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Stand Up Indo Sumedang Photobooth</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}
html,body{
  height:100%;
  overscroll-behavior:none;
}
body{
  background:#111;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  padding:16px;
  gap:16px;
}
.preview{
  position:relative;
  width:min(92vw,420px);
  aspect-ratio:9/16;
  overflow:hidden;
  border-radius:14px;
  background:#000;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
}
video{
  position:absolute;
  left:4%;
  top:5.5%;
  width:92%;
  height:75%;
  object-fit:cover;
  transform:scaleX(-1);
  background:#000;
}
.frame{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}
.status{
  position:absolute;
  left:0;
  right:0;
  top:50%;
  transform:translateY(-50%);
  text-align:center;
  color:#fff;
  font-size:14px;
  padding:0 20px;
  opacity:.85;
  z-index:5;
}
.flash{
  position:absolute;
  inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
  z-index:10;
}
.flash.on{
  animation:flashPop .35s ease-out;
}
@keyframes flashPop{
  0%{opacity:.9;}
  100%{opacity:0;}
}
.result-overlay{
  position:absolute;
  inset:0;
  z-index:8;
  display:none;
}
.result-overlay.show{
  display:block;
}
.result-overlay img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.menu{
  display:flex;
  gap:12px;
  width:min(92vw,420px);
}
button,a{
  flex:1;
  padding:16px 18px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  background:#8b0000;
  color:#fff;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  transition:transform .1s ease,opacity .15s ease;
  touch-action:manipulation;
}
button:active,a:active{
  transform:scale(0.96);
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
#retake,#download{
  display:none;
  background:#333;
}
#download{
  background:#1a7d3a;
}
.menu.result-mode #capture{
  display:none;
}
.menu.result-mode #retake,
.menu.result-mode #download{
  display:flex;
}
canvas{
  display:none;
}
</style>
</head>
<body>

<div class="preview" id="preview">
  <video id="video" autoplay playsinline muted></video>
  <img src="frame.png" class="frame" id="frameImg">
  <div class="status" id="status">Meminta akses kamera...</div>
  <div class="result-overlay" id="resultOverlay">
    <img id="resultImg" alt="Hasil foto">
  </div>
  <div class="flash" id="flash"></div>
</div>

<div class="menu" id="menu">
  <button id="capture" disabled>📸 Ambil Foto</button>
  <button id="retake">🔄 Ambil Ulang</button>
  <a id="download" download="stand-up-indo-sumedang-bg-open-mic.png">⬇️ Download</a>
</div>

<canvas id="canvas" width="1080" height="1920"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const frame = document.getElementById("frameImg");
const statusEl = document.getElementById("status");
const captureBtn = document.getElementById("capture");
const retakeBtn = document.getElementById("retake");
const downloadBtn = document.getElementById("download");
const menu = document.getElementById("menu");
const resultOverlay = document.getElementById("resultOverlay");
const resultImg = document.getElementById("resultImg");
const flashEl = document.getElementById("flash");

/*
Koordinat area foto pada hasil 1080x1920.
Harus sinkron dengan posisi video di CSS (left 4%, top 5.5%, width 92%, height 75%).
Sesuaikan jika bingkai (frame.png) diganti dengan versi lain.
*/
const FRAME_X = 43;   // 4% of 1080
const FRAME_Y = 106;  // 5.5% of 1920
const FRAME_W = 994;  // 92% of 1080
const FRAME_H = 1440; // 75% of 1920

let streamReady = false;

function setStatus(msg){
  statusEl.textContent = msg;
  statusEl.style.display = msg ? "block" : "none";
}

async function startCamera(){
  setStatus("Meminta akses kamera...");
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
  }catch(err){
    console.error(err);
    setStatus("Tidak bisa mengakses kamera. Pastikan izin kamera diaktifkan, lalu muat ulang halaman.");
  }
}

video.addEventListener("loadedmetadata", () => {
  streamReady = true;
  captureBtn.disabled = false;
  setStatus("");
});

startCamera();

// Crop the video like CSS object-fit:cover so the captured photo isn't stretched.
function drawCoveredVideo(destX, destY, destW, destH){
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const destRatio = destW / destH;
  const srcRatio = vw / vh;

  let sx, sy, sw, sh;
  if (srcRatio > destRatio){
    // source wider than dest: crop left/right
    sh = vh;
    sw = vh * destRatio;
    sx = (vw - sw) / 2;
    sy = 0;
  } else {
    // source taller than dest: crop top/bottom
    sw = vw;
    sh = vw / destRatio;
    sx = 0;
    sy = (vh - sh) / 2;
  }

  ctx.drawImage(video, sx, sy, sw, sh, destX, destY, destW, destH);
}

function takePhoto(){
  if (!streamReady) return;

  // flash effect
  flashEl.classList.remove("on");
  void flashEl.offsetWidth;
  flashEl.classList.add("on");

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // mirror to match the selfie preview
  ctx.save();
  ctx.translate(FRAME_X + FRAME_W, FRAME_Y);
  ctx.scale(-1, 1);
  drawCoveredVideo(0, 0, FRAME_W, FRAME_H);
  ctx.restore();

  // draw frame overlay on top
  ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);

  const dataUrl = canvas.toDataURL("image/png");
  resultImg.src = dataUrl;
  downloadBtn.href = dataUrl;

  resultOverlay.classList.add("show");
  menu.classList.add("result-mode");
}

function retake(){
  resultOverlay.classList.remove("show");
  menu.classList.remove("result-mode");
}

captureBtn.addEventListener("click", takePhoto);
retakeBtn.addEventListener("click", retake);
</script>
</body>
</html>
